<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>RBMC Downloader</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="main-header">
  <div class="header-content">
    <a th:href="@{/}" class="logo">
      <img th:src="@{/images/logo.svg}"
           alt="RBMC Downloader Logo"
           class="logo-img">
      <span class="logo-text">RBMC Downloader</span>
    </a>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <h1>Download de arquivos RINEX da RBMC</h1>
  <p>Baixe dados GNSS diretamente do servidor do IBGE de forma rápida e simples.</p>
</section>

<!-- ================= CONTEÚDO ================= -->
<main class="container">

  <!-- STATUS -->
  <div th:if="${mensagem}"
       th:text="${mensagem}"
       class="status-box status-info">
  </div>

  <!-- FORMULÁRIO -->
  <form method="post" th:action="@{/buscar}" class="search-card">

    <div class="field">
      <label for="ano">ANO</label>
      <select id="ano" name="ano" required>
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>

    <div class="field">
      <label for="dia">DIA DO ANO (DOY)</label>
      <input type="number" id="dia" name="dia"
             placeholder="Ex: 037"
             min="1" max="366" required>
    </div>

    <div class="field">
      <label for="estacao">CÓDIGO RBMC</label>
      <input type="text" id="estacao" name="estacao"
             placeholder="Ex: PERC"
             maxlength="4" required>
    </div>

    <button type="submit" class="btn-search">
      🔍 Buscar
    </button>

  </form>

</main>

<!-- ================= FOOTER ================= -->
<footer class="main-footer">

  <div class="footer-logo">
    <img th:src="@{/images/logo.svg}"
         alt="RBMC Logo"
         class="footer-logo-img">
  </div>

  <div class="footer-copy">
    © 2026 RBMC Downloader • Projeto independente
  </div>

</footer>

</body>
</html>
