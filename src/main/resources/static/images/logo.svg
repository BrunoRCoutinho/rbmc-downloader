<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="RBMC Downloader">
  <defs>
    <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0.15"></stop>
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="oklch(0.75 0.14 190)" stop-opacity="0.1"></stop>
    </linearGradient>

    <linearGradient id="sat-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(0.85 0.08 190)"></stop>
      <stop offset="100%" stop-color="oklch(0.65 0.14 190)"></stop>
    </linearGradient>
  </defs>

  <!-- Glow -->
  <circle cx="60" cy="60" r="55" fill="url(#globe-glow)"></circle>

  <!-- Globe -->
  <circle cx="60" cy="60" r="24" stroke="oklch(0.75 0.14 190)" stroke-width="1.5" fill="none" opacity="0.5"></circle>

  <!-- Latitude -->
  <ellipse cx="60" cy="60" rx="24" ry="10" stroke="oklch(0.75 0.14 190)" stroke-width="0.8" fill="none" opacity="0.3"></ellipse>
  <ellipse cx="60" cy="60" rx="24" ry="18" stroke="oklch(0.75 0.14 190)" stroke-width="0.8" fill="none" opacity="0.25"></ellipse>

  <!-- Longitude -->
  <ellipse cx="60" cy="60" rx="10" ry="24" stroke="oklch(0.75 0.14 190)" stroke-width="0.8" fill="none" opacity="0.3"></ellipse>
  <ellipse cx="60" cy="60" rx="18" ry="24" stroke="oklch(0.75 0.14 190)" stroke-width="0.8" fill="none" opacity="0.25"></ellipse>

  <!-- Orbits -->
  <ellipse cx="60" cy="60" rx="46" ry="18" transform="rotate(-30 60 60)" stroke="url(#orbit-grad-1)" stroke-width="1.2" fill="none"></ellipse>
  <ellipse cx="60" cy="60" rx="42" ry="14" transform="rotate(25 60 60)" stroke="url(#orbit-grad-2)" stroke-width="1" fill="none"></ellipse>

  <!-- Satellite -->
  <g transform="translate(96 38) rotate(60)">
    <rect x="-4" y="-3" width="8" height="6" rx="1" fill="url(#sat-body)"></rect>
    <rect x="-14" y="-2.5" width="9" height="5" rx="0.5" fill="oklch(0.75 0.14 190)" opacity="0.6"></rect>
    <rect x="5" y="-2.5" width="9" height="5" rx="0.5" fill="oklch(0.75 0.14 190)" opacity="0.6"></rect>
    <line x1="0" y1="-3" x2="0" y2="-6" stroke="oklch(0.85 0.08 190)" stroke-width="0.6"></line>
    <circle cx="0" cy="-7" r="1" fill="oklch(0.85 0.10 190)"></circle>
  </g>

  <!-- Signal -->
  <path d="M88 32 Q84 28 80 32" stroke="oklch(0.75 0.14 190)" stroke-width="0.8" fill="none" opacity="0.5"></path>
  <path d="M90 30 Q85 25 80 30" stroke="oklch(0.75 0.14 190)" stroke-width="0.6" fill="none" opacity="0.3"></path>

  <!-- Station -->
  <circle cx="52" cy="54" r="2" fill="oklch(0.75 0.14 190)"></circle>
  <circle cx="52" cy="54" r="4" stroke="oklch(0.75 0.14 190)" stroke-width="0.6" fill="none" opacity="0.4"></circle>
  <circle cx="52" cy="54" r="6.5" stroke="oklch(0.75 0.14 190)" stroke-width="0.4" fill="none" opacity="0.2"></circle>
</svg>